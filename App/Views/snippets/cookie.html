
<div class="cookie-overlay" id="cookieOverlay">
    <div class="cookie-form-container" id="cookieFormContainer">
        <div class="cookie-form-wrapper">
            <button class="cookie-close-btn" id="cookieCloseBtn" aria-label="Schlie&szlig;en">&times;</button>
            <div class="cookie-form-content">
                <h2 class="cookie-title">Cookie-Einstellungen</h2>
                <p class="cookie-description">
                    Wir verwenden Cookies, um Ihre Erfahrung auf unserer Website zu verbessern.
                    Notwendige Cookies sind immer aktiv. Es werden keine Nutzungsdaten gespeichert.
                </p>

                <div class="cookie-options">
                    <div class="cookie-option">
                        <div class="cookie-option-info">
                            <span class="cookie-option-title">Notwendige Cookies</span>
                            <span class="cookie-option-desc">Erforderlich f&uuml;r die Grundfunktionalit&auml;t der Website</span>
                        </div>
                        <label class="cookie-toggle">
                            <input type="checkbox" id="cookieNecessary" checked disabled>
                            <span class="cookie-toggle-slider"></span>
                        </label>
                    </div>
                    {{ csrf_field() }}

                </div>

                <div class="cookie-actions">
                    <button class="cookie-btn cookie-btn-primary" id="cookieAcceptBtn">Alle akzeptieren</button>
                </div>
            </div>
        </div>
    </div>
</div>
